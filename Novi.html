<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Novi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header, one content column, bottom tab bar on phones that turns into a left rail from 900px. */
:root{
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#EFF2F6; --surface:#FFFFFF; --surface-2:#E3E9F0; --fg:#0D141C; --muted:#586577; --line:#D3DBE5;
  --accent:#2457FF; --accent-fg:#FFFFFF; --accent-soft:#DCE5FF; --live:#E91E5A; --ok:#0F9D63;
  --shadow:0 1px 2px rgba(13,20,28,.06),0 8px 24px rgba(13,20,28,.07);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E14; --surface:#131A24; --surface-2:#1C2531; --fg:#EAF0F7; --muted:#92A0B3; --line:#243040;
    --accent:#7396FF; --accent-fg:#0A0E14; --accent-soft:#1B2A52; --live:#FF5F8A; --ok:#3DD598;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E14; --surface:#131A24; --surface-2:#1C2531; --fg:#EAF0F7; --muted:#92A0B3; --line:#243040;
  --accent:#7396FF; --accent-fg:#0A0E14; --accent-soft:#1B2A52; --live:#FF5F8A; --ok:#3DD598;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:inline-flex;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
.bar{max-width:1180px;margin:0 auto;height:62px;display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;font:800 30px/1 var(--font-display);letter-spacing:-.045em;text-decoration:none;color:var(--fg)}
.logo .o{width:.8em;height:.8em;border-radius:50%;background:var(--accent);position:relative;display:inline-block;margin:0 .03em}
.logo .o::after{content:"";position:absolute;inset:0;background:var(--accent-fg);clip-path:polygon(39% 27%,39% 73%,75% 50%)}
.search{flex:1;min-width:0;max-width:560px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;color:var(--fg)}
.search:focus-within{border-color:var(--accent)}
.me{flex:none;border:0;background:transparent;padding:0;border-radius:50%}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-top:6px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);padding:4px 0;font:600 11.5px var(--font-body)}
.tab[aria-current="page"]{color:var(--accent)}
.tab.post .pl{width:46px;height:34px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.tab.post{color:var(--fg)}
body.room .tabs{display:none}

main{width:100%;max-width:1212px;margin:0 auto;padding-top:6px;padding-bottom:110px}
body.room main{padding-bottom:0}

@media (min-width:900px){
  .tabs{top:calc(62px + env(safe-area-inset-top,0px));bottom:auto;right:auto;width:196px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);background:var(--bg);padding-top:14px;padding-right:12px}
  .tab{flex:none;max-width:none;flex-direction:row;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px;justify-content:flex-start}
  .tab:hover{background:var(--surface-2)}
  .tab.post .pl{width:auto;height:auto;background:transparent;color:inherit;display:inline-flex}
  .tab.post{color:var(--fg)}
  main{margin-left:208px;width:calc(100% - 208px);max-width:none;padding-bottom:60px}
  body.room .tabs{display:flex}
  body.room main{padding-bottom:0}
}

/* shared bits */
.title{font:800 26px/1.1 var(--font-display);letter-spacing:-.03em;margin:8px 0 14px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 15px;border-radius:999px;font:600 14px var(--font-body);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--live);border-color:var(--live)}
.btn[disabled]{opacity:.55;cursor:default}
.like[aria-pressed="true"]{color:var(--live);border-color:var(--live)}
.like[aria-pressed="true"] svg{fill:currentColor}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 14px;outline:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:78px}
.pill{border-radius:999px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 52% 38%);color:#fff;font:700 15px var(--font-display)}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;font:800 10.5px var(--font-body);letter-spacing:.09em;padding:3px 7px;border-radius:6px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty b{color:var(--fg);font:700 17px var(--font-display)}

/* feed */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font:600 13.5px var(--font-body)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.chip.live-chip[aria-pressed="false"]{color:var(--live)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr));gap:24px 16px}
.card{display:block;color:inherit;text-decoration:none;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#0c1118;max-width:100%}
.thumb canvas,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .thumb{box-shadow:var(--shadow)}
.badge{position:absolute;background:rgba(8,12,18,.74);color:#fff;font:600 11.5px var(--font-body);padding:3px 7px;border-radius:6px}
.badge.dur{right:8px;bottom:8px;font-variant-numeric:tabular-nums}
.badge.ex{left:8px;top:8px;letter-spacing:.03em}
.meta{display:flex;gap:11px;margin-top:11px;min-width:0}
.meta .t{font:700 15.5px/1.25 var(--font-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta .s{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.meta>div{min-width:0}
.gtile{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:linear-gradient(155deg,hsl(var(--h) 68% 36%),hsl(calc(var(--h) + 38) 64% 20%))}
.gtile .live{position:absolute;left:10px;top:10px}
.mb{align-self:flex-start;background:rgba(255,255,255,.17);color:#fff;font-size:12.5px;padding:5px 10px;border-radius:13px 13px 13px 4px;max-width:88%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb.r{align-self:flex-end;border-radius:13px 13px 4px 13px;background:rgba(255,255,255,.3)}
.note{color:var(--muted);font-size:13px;margin:22px 0 0}

/* watch */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font:600 14px var(--font-body);padding:6px 0;margin-bottom:6px}
.watch{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1040px){.watch{grid-template-columns:minmax(0,1fr) 340px}}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;max-width:100%}
.player video,.player canvas{width:100%;height:100%;display:block;object-fit:contain}
.novid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cfd8e3;padding:24px}
.pc{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:26px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.pbtn{border:0;background:transparent;color:#fff;padding:4px;display:grid;place-items:center}
.pbar{flex:1;height:24px;display:flex;align-items:center;cursor:pointer}
.pbar span{display:block;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:#fff}
.ptime{font:600 12px var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.wt{font:800 24px/1.15 var(--font-display);letter-spacing:-.025em;margin:14px 0 10px;overflow-wrap:anywhere}
.wrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wrow .who{display:flex;gap:10px;align-items:center;margin-right:auto;min-width:0}
.wrow .who b{display:block;font-weight:700;overflow-wrap:anywhere}
.desc{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.sec{font:700 17px var(--font-display);margin:26px 0 12px}
.cform{display:flex;gap:8px;margin-bottom:16px}
.cform .inp{border-radius:999px}
.cm{display:flex;gap:11px;margin-bottom:15px}
.cm>div{min-width:0}
.cm b{font-weight:700;font-size:13.5px}
.cm span.t{color:var(--muted);font-size:12.5px;margin-left:6px}
.cm p{margin:2px 0 0;overflow-wrap:anywhere}
.wside{display:grid;gap:14px;align-content:start}
.wside .card{display:grid;grid-template-columns:146px minmax(0,1fr);gap:10px}
.wside .meta{margin-top:0}
.wside .thumb{border-radius:10px}

/* groups + room */
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ghead .title{margin-right:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;margin:14px 0;max-width:560px}
.panel label{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.chk{display:flex!important;grid-auto-flow:column;align-items:center;gap:10px!important;font-weight:500!important}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.list{display:grid;gap:8px;max-width:720px}
.row{display:flex;align-items:center;gap:13px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;min-width:0}
.row:hover{border-color:var(--muted)}
.row .sq{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font:800 20px var(--font-display);background:linear-gradient(155deg,hsl(var(--h) 68% 40%),hsl(calc(var(--h) + 38) 64% 26%))}
.row .tx{min-width:0;flex:1}
.row .tx b{display:block;font:700 15.5px var(--font-display);overflow-wrap:anywhere}
.row .tx span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room{display:flex;flex-direction:column;min-height:calc(100vh - 78px)}
.rhead{display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rhead .tx{flex:1;min-width:140px}
.rhead .tx b{display:block;font:800 19px/1.15 var(--font-display);overflow-wrap:anywhere}
.rhead .tx span{color:var(--muted);font-size:13px}
.rhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.msgs{flex:1;display:flex;flex-direction:column;gap:5px;padding:14px 0 18px;max-width:760px;width:100%}
.msg{align-self:flex-start;max-width:min(82%,520px);background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:16px 16px 16px 5px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:transparent;border-radius:16px 16px 5px 16px}
.msg .who{display:block;font:700 12px var(--font-body);color:var(--muted);margin-bottom:1px}
.msg.me .who{display:none}
.gap{margin-top:8px}
.composer{position:sticky;bottom:0;display:flex;gap:8px;background:var(--bg);padding:10px 0 max(12px,env(safe-area-inset-bottom,0px));max-width:760px;width:100%}
.composer .inp{border-radius:999px}
.sendbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}

/* upload + profile */
.up{max-width:640px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:34px 20px;display:grid;gap:14px;justify-items:center;text-align:center;background:var(--surface)}
.drop .big{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.drop b{font:800 20px var(--font-display)}
.drop .bs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pv{border-radius:var(--r);overflow:hidden;background:#000;max-width:100%}
.pv video{width:100%;max-height:46vh;display:block}
.form{display:grid;gap:16px;margin-top:16px}
.form label.l{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 12px}
.prof{max-width:720px}
.pid{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.pid .av{width:72px;height:72px;font-size:30px}
.pid .f{flex:1;display:flex;gap:8px;min-width:0;flex-wrap:wrap}
.pid .f .inp{flex:1;min-width:150px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:800 24px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--muted)}
.dot.on{background:var(--ok)}

/* shorts */
.shorts{height:calc(100vh - 62px - env(safe-area-inset-top,0px) - 84px - env(safe-area-inset-bottom,0px));height:calc(100dvh - 62px - env(safe-area-inset-top,0px) - 84px - env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;outline:0}
.shorts::-webkit-scrollbar{display:none}
.short{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:4px 0;display:grid;place-items:center}
.sframe{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden}
.sframe video,.sframe canvas{width:100%;height:100%;object-fit:contain;display:block}
.sinfo{position:absolute;left:0;right:68px;bottom:0;padding:44px 14px 14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.sinfo .sw{display:flex;align-items:center;gap:8px}
.sinfo p{margin:6px 0 0;font:700 15px/1.25 var(--font-display);overflow-wrap:anywhere}
.sside{position:absolute;right:8px;bottom:18px;display:grid;gap:14px}
.sbtn{border:0;background:rgba(10,14,20,.55);color:#fff;border-radius:999px;padding:8px 12px;font:600 12px var(--font-body)}
.sbtn.big{display:grid;justify-items:center;gap:2px;padding:10px 8px;min-width:50px}
.sbtn[aria-pressed="true"]{color:#ff5f8a}
.sbtn[aria-pressed="true"] svg{fill:currentColor}
.sframe>.sbtn:not(.big){position:absolute;right:10px;top:10px}
body.sh main{padding-bottom:0}
@media (min-width:900px){.shorts{height:calc(100vh - 62px - env(safe-area-inset-top,0px) - 20px);height:calc(100dvh - 62px - env(safe-area-inset-top,0px) - 20px)}}

/* group video + comments + editor */
.gfr video{position:absolute;inset:0;object-fit:cover}
.gbg{position:absolute;inset:0;background:linear-gradient(160deg,hsl(var(--h) 75% 42%),hsl(calc(var(--h) + 55) 70% 20%),hsl(calc(var(--h) + 110) 70% 30%));background-size:220% 220%;animation:gdrift 9s ease-in-out infinite alternate}
@keyframes gdrift{from{background-position:0% 0%}to{background-position:100% 100%}}
.gshade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 30%,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
.gl{position:absolute;left:12px;top:12px}
.gtext{position:absolute;left:14px;right:14px;top:17%;text-align:center;font:800 clamp(26px,7vw,38px)/1.1 var(--font-display);letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.55);overflow-wrap:anywhere;pointer-events:none}
.jbtn{position:absolute;display:inline-flex;align-items:center;gap:8px;border:0;background:#fff;color:#0D141C;font:700 15px var(--font-body);padding:12px 20px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);white-space:nowrap}
.jbtn.center{left:50%;top:50%;transform:translate(-50%,-50%)}
.jbtn.corner{right:12px;bottom:14px;padding:9px 14px;font-size:13px}
.ginfo{position:absolute;left:14px;right:150px;bottom:14px;color:#fff;display:grid;gap:2px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ginfo b{font:800 17px var(--font-display);overflow-wrap:anywhere}
.ginfo span{font-size:13px;opacity:.9}
.tapsnd{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);background:rgba(10,14,20,.78);color:#fff;padding:9px 16px;border-radius:999px;font:700 14px var(--font-body);pointer-events:none;white-space:nowrap;z-index:2}
.sbtn.snd{display:inline-flex;align-items:center;gap:6px}
.shorts{position:relative}
.shorts.blank{display:block;overflow:auto;scroll-snap-type:none;height:auto}
.wsplit{position:fixed;left:0;right:0;bottom:0;top:calc(62px + env(safe-area-inset-top,0px));z-index:45;background:var(--bg)}
.wsin{max-width:680px;margin:0 auto;height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.wtop{position:relative;background:#000;overflow:hidden;min-height:0}
.wtop video{width:100%;height:100%;object-fit:contain;display:block}
.wtop .sbtn{position:absolute;top:10px}
.wtop .wb{left:10px;display:inline-flex;align-items:center;gap:4px}
.wtop .snd{right:10px}
.wpanel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-top:1px solid var(--line)}
.whead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}

(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);

}
const I={
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6"/><path d="M18 14.8c2 .7 3.2 2.4 3.5 5.2"/>',

  camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3z"/>',
  live:'<circle cx="12" cy="12" r="2"/><path d="M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>'
};
const ic=(n,s)=>h('span',{class:'ic',html:'<svg viewBox="0 0 24 24" width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>'});
const fmtCount=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' Mio.':n>=1000?(n/1000).toFixed(1).replace('.',',').replace(',0','')+' Tsd.':String(n);
function ago(ts){
  const s=Math.max(1,Math.round((Date.now()-ts)/1000));
  if(s<60)return'gerade eben';
  const m=Math.round(s/60);if(m<60)return'vor '+m+' Min.';
  const hr=Math.round(m/60);if(hr<24)return'vor '+hr+' Std.';
  const d=Math.round(hr/24);if(d<30)return d===1?'gestern':'vor '+d+' Tagen';
  const mo=Math.round(d/30);return mo<12?'vor '+mo+' Mon.':'vor '+Math.round(mo/12)+' J.';
}
const clock=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hue=s=>{let x=0;for(const ch of String(s))x=(x*31+ch.charCodeAt(0))%360;return x};
const uid=()=>Math.random().toString(36).slice(2,10);
const avatar=(name,size)=>h('span',{class:'av',style:'--h:'+hue(name)+(size?';width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.42)+'px':''),'aria-hidden':'true'},(String(name||'?').trim().charAt(0)||'?').toUpperCase());
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}

/* ---------- guest identity (no sign-in) ---------- */
let gid=ls('novi:gid');
if(!gid){gid='g'+uid()+Date.now().toString(36).slice(-4);ls('novi:gid',gid)}
let name=ls('novi:name')||('Gast '+(1000+Math.floor(Math.random()*9000)));
ls('novi:name',name);
let joined=[];try{joined=JSON.parse(ls('novi:joined')||'[]')}catch(e){joined=[]}
const join=id=>{if(joined.indexOf(id)<0){joined.push(id);ls('novi:joined',JSON.stringify(joined))}};

/* ---------- local video storage ---------- */
const mem={};
const blobStore={
  db:null,
  open(){
    if(this.p)return this.p;
    this.p=new Promise(res=>{
      try{
        const r=indexedDB.open('novi',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('blobs');
        r.onsuccess=()=>{this.db=r.result;res(this.db)};
        r.onerror=()=>res(null);
      }catch(e){res(null)}
    });
    return this.p;
  },
  async put(k,b){
    mem[k]=b;
    const d=await this.open();if(!d)return;
    await new Promise(res=>{try{const tx=d.transaction('blobs','readwrite');tx.objectStore('blobs').put(b,k);tx.oncomplete=()=>res();tx.onerror=()=>res();tx.onabort=()=>res()}catch(e){res()}});
  },
  async get(k){
    if(mem[k])return mem[k];
    const d=await this.open();if(!d)return null;
    return new Promise(res=>{try{const r=d.transaction('blobs').objectStore('blobs').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}});
  },
  async del(k){
    delete mem[k];
    const d=await this.open();if(!d)return;
    try{d.transaction('blobs','readwrite').objectStore('blobs').delete(k)}catch(e){}
  }
};
const urlCache={};
async function srcFor(v){
  if(v.assetId)return'/_blob/'+v.assetId;
  if(v.blobKey){
    if(urlCache[v.blobKey])return urlCache[v.blobKey];
    const b=await blobStore.get(v.blobKey);
    if(!b)return null;
    return(urlCache[v.blobKey]=URL.createObjectURL(b));
  }
  return null;
}

/* ---------- data: shared (db) + this device ---------- */
const COLS=['videos','likes','comments','groups','messages'];
const shared={},local={};
COLS.forEach(c=>{shared[c]=[];try{local[c]=JSON.parse(ls('novi:l:'+c)||'[]')}catch(e){local[c]=[]}});
const saveLocal=c=>ls('novi:l:'+c,JSON.stringify(local[c]));
const rows=c=>shared[c].concat(local[c]);
let db=null,assetsCap=null,conn='pending';
let failT=0;
function writeFailed(){if(Date.now()-failT>4000){failT=Date.now();toast('Das ging nicht für alle. Hier darfst du nur zuschauen.')}}
let qd=0;
function notify(){if(qd)return;qd=requestAnimationFrame(()=>{qd=0;if(cur&&cur.update)cur.update();paintMe()})}

async function put(c,data,toShared){
  const row=Object.assign({},data,{createdAt:Date.now()});
  if(db&&toShared){
    try{const r=await db.collection(c).add(row);return r.id}catch(e){writeFailed()}
  }
  row.id='l'+uid();local[c].push(row);saveLocal(c);notify();return row.id;
}
async function patch(c,row,fields){
  if(row._s){try{await db.doc(c+'/'+row.id).update(fields)}catch(e){writeFailed()}return}
  Object.assign(row,fields);saveLocal(c);notify();
}
async function remove(c,row){
  if(row._s){try{await db.doc(c+'/'+row.id).delete()}catch(e){writeFailed()}return}
  local[c]=local[c].filter(x=>x.id!==row.id);saveLocal(c);notify();
}
async function toggleLike(v){
  const ex=rows('likes').find(l=>l.videoId===v.id&&l.gid===gid);
  if(ex){await remove('likes',ex);return}
  const key=v.id+'_'+gid,row={videoId:v.id,gid:gid,createdAt:Date.now()};
  if(db&&v._s){try{await db.doc('likes/'+key).set(row);return}catch(e){writeFailed()}}
  local.likes.push(Object.assign({id:key},row));saveLocal('likes');notify();
}

async function connect(){
  if(!(window.claude&&window.claude.use)){conn='off';notify();return}
  try{db=await window.claude.use('db')}catch(e){db=null}
  try{assetsCap=await window.claude.use('assets')}catch(e){assetsCap=null}
  if(!db){conn='off';notify();return}
  conn='on';
  const sub=(c,q)=>{try{q.onSnapshot(s=>{shared[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id,_s:true}));notify()},()=>{})}catch(e){}};
  sub('videos',db.collection('videos').orderBy('createdAt','desc').limit(300));
  sub('groups',db.collection('groups').orderBy('createdAt','desc').limit(200));
  sub('likes',db.collection('likes').limit(1000));
  sub('comments',db.collection('comments').orderBy('createdAt','desc').limit(1000));
  sub('messages',db.collection('messages').orderBy('createdAt','desc').limit(800));
  notify();
}

/* ---------- data helpers ---------- */
const videos=()=>rows('videos');
const groups=()=>rows('groups');
const msgsOf=gId=>rows('messages').filter(m=>m.groupId===gId).sort((a,b)=>a.createdAt-b.createdAt);
const commentsOf=vId=>rows('comments').filter(c=>c.videoId===vId).sort((a,b)=>b.createdAt-a.createdAt);
const likeCount=v=>rows('likes').filter(l=>l.videoId===v.id).length;
const isLiked=v=>rows('likes').some(l=>l.videoId===v.id&&l.gid===gid);
const snd={on:true};
let cur=null,curHash=null,prevTab='feed';
const state={q:'',lastShort:null};
const CATS=['Musik','Gaming','Lustig','Natur','Kreativ'];

/* ---------- music: built-in songs made with WebAudio ---------- */
const TRACKS={
  chill:{bpm:80,kind:'pad',ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]},
  beat:{bpm:108,kind:'beat',bass:[45,45,48,43]},
  retro:{bpm:128,kind:'arp',ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]]},
  ruhig:{bpm:56,kind:'drone',sc:[60,62,64,67,69,72]}
};
const mtof=n=>440*Math.pow(2,(n-69)/12);
const Music={
  ctx:null,g:null,timer:null,aud:null,owner:null,cur:null,step:0,tok:0,nb:null,
  stop(owner){
    if(owner&&this.owner!==owner)return;
    this.tok++;clearInterval(this.timer);this.timer=null;this.owner=null;this.cur=null;
    if(this.aud){try{this.aud.pause()}catch(e){}this.aud=null}
    if(this.g){try{this.g.disconnect()}catch(e){}this.g=null}
  },
  async play(p,vol,owner){
    if(!p||!p.music||p.music==='none'){this.stop(owner);return}
    const id=p.music+':'+(p.musicKey||'');
    if(this.cur===id&&this.owner===(owner||null)&&(this.g||this.aud))return;
    this.stop();
    const tok=++this.tok,v=vol==null?.6:vol;
    this.owner=owner||null;this.cur=id;
    if(p.music==='own'){
      const b=p.musicKey?await blobStore.get(p.musicKey):null;
      if(!b||tok!==this.tok)return;
      const a=new Audio(URL.createObjectURL(b));a.loop=true;a.volume=v;this.aud=a;a.play().catch(()=>{});return;
    }
    const T=TRACKS[p.music],AC=window.AudioContext||window.webkitAudioContext;
    if(!T||!AC)return;
    if(!this.ctx)this.ctx=new AC();
    const ctx=this.ctx;
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    const g=ctx.createGain();g.gain.value=v;g.connect(ctx.destination);this.g=g;
    this.step=0;
    let next=ctx.currentTime+.06;
    const d=60/T.bpm/2;
    const run=()=>{while(next<ctx.currentTime+.5){this.note(T,this.step,next,d);this.step++;next+=d}};
    run();this.timer=setInterval(run,150);
  },
  note(T,step,t,d){
    const ctx=this.ctx,g=this.g;if(!g)return;
    const bar=Math.floor(step/8)%4,s=step%8;
    const tone=(f,type,len,vol)=>{
      const o=ctx.createOscillator(),e=ctx.createGain();
      o.type=type;o.frequency.setValueAtTime(f,t);
      e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(vol,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+len);
      o.connect(e);e.connect(g);o.start(t);o.stop(t+len+.05);
    };
    const hat=vol=>{
      if(!this.nb){const n=Math.floor(ctx.sampleRate*.05),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;this.nb=b}
      const sr=ctx.createBufferSource(),e=ctx.createGain(),f=ctx.createBiquadFilter();
      f.type='highpass';f.frequency.value=7000;sr.buffer=this.nb;
      e.gain.setValueAtTime(vol,t);e.gain.exponentialRampToValueAtTime(.0001,t+.05);
      sr.connect(f);f.connect(e);e.connect(g);sr.start(t);
    };
    const kick=()=>{
      const o=ctx.createOscillator(),e=ctx.createGain();
      o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
      e.gain.setValueAtTime(.7,t);e.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(e);e.connect(g);o.start(t);o.stop(t+.25);
    };
    if(T.kind==='pad'){
      const c=T.ch[bar];
      if(s===0)c.forEach(n=>tone(mtof(n),'triangle',d*8,.12));
      if(s%2===0)tone(mtof(c[(s/2)%3]+12),'sine',d*1.6,.08);
    }else if(T.kind==='beat'){
      if(s%4===0)kick();
      if(s%2===1)hat(.12);
      if(s===0||s===3||s===6)tone(mtof(T.bass[bar]),'square',d*.9,.1);
    }else if(T.kind==='arp'){
      const c=T.ch[bar];
      tone(mtof(c[s%3]+(s>=4?12:0)),'square',d*.8,.07);
      if(s===0)tone(mtof(c[0]-12),'triangle',d*3,.12);
    }else{
      const k=Math.floor(step/8);
      if(s===0&&k%2===0)tone(mtof(T.sc[(k*2)%T.sc.length]),'sine',d*10,.12);
      if(s===4)tone(mtof(T.sc[(k*3+2)%T.sc.length]-12),'sine',d*6,.1);
    }
  }
};

/* ---------- shared pieces ---------- */
function notFound(msg){return{el:h('div',{class:'empty'},h('b',{},msg),h('button',{class:'btn primary',onclick:()=>go('feed')},'Zurück zu Entdecken'))}}
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#ffffff';
const safeHue=n=>{n=Number(n);return isFinite(n)?Math.max(0,Math.min(360,n)):215};
const okMusic=m=>(m==='own'||TRACKS[m])?m:'none';
const okId=x=>typeof x==='string'&&/^[0-9a-f]{32}$/.test(x)?x:null;
function normPub(g){
  const p=g.pub||{};
  return{
    grad:safeHue(p.grad!=null?p.grad:hue(g.name)),color:safeColor(p.color),
    text:p.text!=null?String(p.text).slice(0,60):g.name,pos:p.pos==='corner'?'corner':'center',
    music:okMusic(p.music),musicKey:typeof p.musicKey==='string'?p.musicKey:null,vsound:p.vsound!==false,

/* One controller per video frame: play, pause, sound and music. */
function mediaCtl(o){
  let act=false,need=false;
  const hasMusic=()=>!!(o.p&&o.p.music&&o.p.music!=='none');
  const hint=h('div',{class:'tapsnd',hidden:true},'Tippen für Ton');
  const sb=h('button',{class:'sbtn snd',type:'button','aria-label':'Ton an oder aus',onclick:e=>{e.stopPropagation();snd.on=!snd.on;need=false;hint.hidden=true;apply()}});
  function label(){sb.replaceChildren(ic(snd.on?'vol':'mute',18),h('span',{},snd.on?'Ton an':'Ton aus'))}
  function apply(){
    label();
    if(!act)return;
    const wantV=snd.on&&(!o.p||o.p.vsound!==false);
    const v=o.vid;
    if(v&&v.getAttribute('src')){
      v.muted=!wantV;
      const r=v.play();
      if(r&&r.catch)r.catch(()=>{v.muted=true;need=wantV;hint.hidden=!need;v.play().catch(()=>{})});
    }
    if(hasMusic()){if(snd.on)Music.play(o.p,.6,o);else Music.stop(o)}
  }
  label();
  return{sb:sb,hint:hint,apply:apply,
    on(){
      act=true;
      if(snd.on&&needsGesture()){
        need=true;hint.hidden=false;
        if(o.vid&&o.vid.getAttribute('src')){o.vid.muted=true;o.vid.play().catch(()=>{})}

    },
    off(){act=false;if(o.vid)o.vid.pause();if(hasMusic())Music.stop(o)},
    tap(){if(need){need=false;hint.hidden=true;apply();return true}return false}
  };
}

/* ---------- editing helpers ---------- */
const FILTERS={none:'',warm:'sepia(.35) saturate(1.3) hue-rotate(-10deg)',cool:'saturate(1.1) hue-rotate(15deg) brightness(1.05)',bw:'grayscale(1) contrast(1.1)',retro:'sepia(.6) contrast(.95) brightness(1.05)',vivid:'saturate(1.7) contrast(1.1)'};
const FILTER_NAMES=[['none','Original'],['warm','Warm'],['cool','Kalt'],['bw','S/W'],['retro','Retro'],['vivid','Lebendig']];
const SPEEDS=[.5,1,1.5,2];
function normEd(v){
  const e=(v&&v.ed)||{};
  const sp=SPEEDS.indexOf(Number(e.speed))>=0?Number(e.speed):1;
  const ts=Math.max(0,Number(e.ts)||0),te=Math.max(0,Number(e.te)||0);
  return{
    filter:Object.prototype.hasOwnProperty.call(FILTERS,e.filter)?e.filter:'none',speed:sp,ts:ts,te:te>ts?te:0,
    text:e.text?String(e.text).slice(0,80):'',color:safeColor(e.color),
    pos:['top','mid','bottom'].indexOf(e.pos)>=0?e.pos:'bottom',
    music:okMusic(e.music),musicKey:typeof e.musicKey==='string'?e.musicKey:null,vsound:e.vsound!==false

}
function applyEd(vid,ed){

  const sync=()=>{vid.playbackRate=ed.speed};
  vid.addEventListener('loadedmetadata',()=>{sync();if(ed.ts>0){try{vid.currentTime=ed.ts}catch(e){}}});

}

        P.music==='own'?h('div',{class:'cats'},h('label',{class:'fpick',for:'mus'},h('span',{class:'fl'},ic('plus',18),P.musicName||'Musikdatei wählen'),mf)):null,
        h('p',{class:'hint'},'Chill, Beat, Retro und Ruhig hören alle. Eine eigene Datei hörst nur du auf diesem Gerät.')),
      sec('Text',ti,
        h('div',{class:'cats'},COLORS.map(c=>h('button',{type:'button',class:'swatch','aria-label':'Textfarbe '+c,'aria-pressed':String(P.color===c),style:'background:'+c,onclick:()=>{P.color=c;fr.refresh();paint()}})))),
      sec('Button „Gruppe beitreten“',chips([['center','In der Mitte'],['corner','In der Ecke']],it=>P.pos===it[0],it=>{P.pos=it[0];fr.refresh();paint()})),
      h('label',{class:'chk',for:'pvs'},h('input',{type:'checkbox',id:'pvs',checked:P.vsound,onchange:e=>{P.vsound=e.target.checked;fr.refresh()}}),'Originalton des Videos abspielen'),
      h('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
        h('button',{class:'btn primary',type:'button',disabled:busy,onclick:publish},busy?'Wird veröffentlicht …':'Veröffentlichen'),
        h('button',{class:'btn',type:'button',disabled:busy,onclick:()=>go('group-'+id)},'Abbrechen')));
  }
  paint();
  return{el:h('div',{class:'pub'},prev,h('div',{},h('h1',{class:'title'},'Gruppen-Video'),ctrls)),
    destroy(){fr.m.off();Music.stop();if(P.src)URL.revokeObjectURL(P.src)}};
}

/* ---------- Entdecken: Shorts and group videos, one at a time ---------- */
function shortsView(){
  const box=h('div',{class:'shorts',tabindex:'0','aria-label':'Novi Shorts'});
  const ctl=new Map();
  let paints=[],sig='';
  const items=()=>{
    const q=state.q.trim().toLowerCase();
    const a=videos().map(v=>({k:'v:'+v.id,t:v.createdAt,v:v,s:[v.title,v.author,v.desc].join(' ')}))
      .concat(groups().filter(g=>g.published).map(g=>({k:'g:'+g.id+':'+(g.publishedAt||0),t:g.publishedAt||g.createdAt,g:g,s:[g.name,g.topic,(g.pub&&g.pub.text)||''].join(' ')})));
    return a.filter(x=>!q||x.s.toLowerCase().indexOf(q)>=0).sort((x,y)=>y.t-x.t);
  };
  const sio=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{
    const c=ctl.get(e.target);if(!c)return;
    if(e.isIntersecting&&e.intersectionRatio>=.6){c.on();state.lastShort=e.target.dataset.k}else c.off();
  }),{root:box,threshold:[0,.6,1]}):null;

  function videoItem(x){
    const v=x.v,ed=normEd(v);
    const sec=h('section',{class:'short','data-k':x.k,'aria-label':v.title});
    const fr=h('div',{class:'sframe'});
    const vid=h('video',{loop:true,playsinline:true,preload:'metadata'});
    applyEd(vid,ed);
    const m=mediaCtl({vid:vid,p:ed});
    srcFor(v).then(u=>{if(u){vid.src=u;m.apply()}else fr.append(h('div',{class:'novid'},'Dieses Video liegt nur auf dem Gerät, auf dem es hochgeladen wurde.'))});
    const like=h('button',{class:'sbtn big',type:'button',onclick:()=>toggleLike(v)});
    const cm=h('button',{class:'sbtn big',type:'button','aria-label':'Kommentare',onclick:()=>go('watch-'+v.id)});
    const paint=()=>{
      like.setAttribute('aria-pressed',String(isLiked(v)));
      like.setAttribute('aria-label','Gefällt mir');
      like.replaceChildren(ic('heart',26),h('span',{},fmtCount(likeCount(v))));
      cm.replaceChildren(ic('chat',26),h('span',{},String(commentsOf(v.id).length)));
    };
    paint();
    fr.append(vid,overlayText(ed),m.sb,m.hint,
      h('div',{class:'sinfo'},h('div',{class:'sw'},avatar(v.author,32),h('b',{},v.author)),h('p',{},v.title)),
      h('div',{class:'sside'},like,cm));
    fr.addEventListener('click',e=>{
      if(e.target.closest('button'))return;
      if(m.tap())return;
      if(vid.paused)vid.play().catch(()=>{});else vid.pause();
    });
    sec.append(fr);
    return{sec:sec,c:m,paint:paint};
  }
  function groupItem(x){
    const g=x.g,P=normPub(g);
    const sec=h('section',{class:'short','data-k':x.k,'aria-label':g.name});
    const f=groupFrame(g,P,{onJoin:()=>{join(g.id);go('group-'+g.id)}});
    f.fr.addEventListener('click',e=>{if(e.target.closest('button'))return;f.m.tap()});
    sec.append(f.fr);
    return{sec:sec,c:f.m,paint:f.paintInfo};
  }
  function emptyEl(){
    const q=state.q.trim();
    return h('div',{class:'empty'},
      h('b',{},q?'Nichts gefunden':'Noch keine Shorts'),
      h('span',{},q?'Probier einen anderen Suchbegriff.':'Hier ist alles leer, bis jemand etwas postet. Lade das erste Short hoch.'),
      h('button',{class:'btn primary',onclick:()=>go('upload')},ic('plus',18),'Short posten'));
  }
  function fill(){
    const list=items();
    sig=list.map(x=>x.k+(x.g?'|'+x.g.name+'|'+x.g.topic+'|'+JSON.stringify(x.g.pub||{}):'|'+x.v.title)).join('~')+'#'+state.q;
    if(sio)sio.disconnect();
    ctl.forEach(c=>c.off());ctl.clear();
    if(!list.length){paints=[];box.classList.add('blank');box.replaceChildren(emptyEl());return}
    box.classList.remove('blank');
    const built=list.map(x=>x.g?groupItem(x):videoItem(x));
    paints=built.map(b=>b.paint);
    box.replaceChildren(...built.map(b=>b.sec));
    built.forEach((b,i)=>{ctl.set(b.sec,b.c);if(sio)sio.observe(b.sec);else if(i===0)b.c.on()});
    requestAnimationFrame(()=>{
      const t=state.lastShort&&Array.from(box.children).find(c=>c.dataset&&c.dataset.k===state.lastShort);
      if(t)box.scrollTop=t.offsetTop;
    });
  }
  fill();
  return{el:box,
    update(){
      const list=items();
      const s=list.map(x=>x.k+(x.g?'|'+x.g.name+'|'+x.g.topic+'|'+JSON.stringify(x.g.pub||{}):'|'+x.v.title)).join('~')+'#'+state.q;
      if(s!==sig)fill();else paints.forEach(p=>p());
    },
    destroy(){if(sio)sio.disconnect();ctl.forEach(c=>c.off());ctl.clear();Music.stop()}};
}

/* ---------- upload: pick, edit, save, publish ---------- */
const TOOLS=[['trim','Zuschneiden'],['text','Text'],['filter','Filter'],['music','Musik'],['speed','Tempo'],['sound','Ton']];
function uploadView(){
  let step='pick',file=null,pvUrl=null,dur=0,busy=false,title='',desc='',tool='trim';
  const E={filter:'none',speed:1,ts:0,te:0,text:'',color:'#ffffff',pos:'bottom',music:'none',musicKey:null,musicName:'',vsound:true};
  const box=h('div');
  let vidEl=null,toolsEl=null;

  function pick(f){
    if(!f)return;
    if(f.type&&f.type.indexOf('video/')!==0){toast('Das ist kein Video.');return}
    if(f.size>200*1024*1024){toast('Die Datei ist größer als 200 MB.');return}
    if(pvUrl)URL.revokeObjectURL(pvUrl);
    file=f;pvUrl=URL.createObjectURL(f);dur=0;tool='trim';
    title=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,80);
    Object.assign(E,{filter:'none',speed:1,ts:0,te:0,text:'',color:'#ffffff',pos:'bottom',music:'none',musicKey:null,musicName:'',vsound:true});
    Music.stop('edit');
    step='edit';paint();
  }
  const shareable=()=>!!(db&&assetsCap&&file&&file.size<=20*1024*1024&&/^video\/(mp4|webm)/.test(file.type));
  const chipRow=(list,isOn,set)=>h('div',{class:'cats'},list.map(it=>h('button',{type:'button',class:'chip','aria-pressed':String(isOn(it)),onclick:()=>set(it)},it[1])));
  const fmt=s=>clock(s)+(s%1?'':'');

  /* step 1 */
  function paintPick(){
    box.replaceChildren(h('div',{class:'drop'},
      h('span',{class:'big'},ic('video',30)),h('b',{},'Short auswählen'),
      h('span',{class:'muted'},'Ohne Konto. Danach bearbeitest du es, speicherst es und veröffentlichst es.'),
      h('div',{class:'bs'},
        fileBtn('Aus der Galerie','gallery','video/*',pick,'primary'),
        fileBtn('Jetzt aufnehmen','camera','video/*',pick,'',{capture:'environment'})),
      h('p',{class:'hint'},'Tippe auf den Knopf unter der Beschriftung. Öffnet sich nichts, öffne diesen Link direkt im Browser deines Handys (Chrome oder Safari).')));
  }

  /* step 2 */
  function paintTools(){
    if(!toolsEl)return;
    const max=dur>0?dur:1;
    let body;
    if(tool==='trim'){
      const ro=h('div',{class:'muted ro'});
      const showRo=()=>{const te=E.te>0?E.te:max;const f1=n=>n.toFixed(1).replace('.',',')+' s';ro.textContent='Von '+f1(E.ts)+' bis '+f1(te)+' · Länge '+f1(Math.max(0,te-E.ts))};
      const a=h('input',{type:'range',id:'trs',min:'0',max:String(max),step:'0.1',value:String(E.ts),'aria-label':'Start',oninput:e=>{
        const te=E.te>0?E.te:max;E.ts=Math.min(parseFloat(e.target.value),te-.5);if(E.ts<0)E.ts=0;e.target.value=String(E.ts);
        if(vidEl)try{vidEl.currentTime=E.ts}catch(x){}
        showRo();
      }});
      const b=h('input',{type:'range',id:'tre',min:'0',max:String(max),step:'0.1',value:String(E.te>0?E.te:max),'aria-label':'Ende',oninput:e=>{
        let t=Math.max(parseFloat(e.target.value),E.ts+.5);if(t>max)t=max;e.target.value=String(t);
        E.te=t>=max-.05?0:t;showRo();
      }});
      showRo();
      body=h('div',{class:'psec'},h('label',{class:'rl',for:'trs'},'Anfang',a),h('label',{class:'rl',for:'tre'},'Ende',b),ro,
        dur>0?null:h('p',{class:'hint'},'Die Länge wird noch gelesen …'));
    }else if(tool==='text'){
      const ti=h('input',{class:'inp',id:'otx',maxlength:'80',value:E.text,placeholder:'Text über dem Video',oninput:e=>{E.text=e.target.value;paintOv()}});
      body=h('div',{class:'psec'},ti,
        h('div',{class:'cats'},COLORS.map(c=>h('button',{type:'button',class:'swatch','aria-label':'Textfarbe '+c,'aria-pressed':String(E.color===c),style:'background:'+c,onclick:()=>{E.color=c;paintOv();paintTools()}}))),
        chipRow([['top','Oben'],['mid','Mitte'],['bottom','Unten']],it=>E.pos===it[0],it=>{E.pos=it[0];paintOv();paintTools()}));
    }else if(tool==='filter'){
      body=h('div',{class:'psec'},chipRow(FILTER_NAMES,it=>E.filter===it[0],it=>{E.filter=it[0];if(vidEl)vidEl.style.filter=FILTERS[E.filter]||'';paintTools()}));
    }else if(tool==='music'){
      body=h('div',{class:'psec'},
        chipRow(MUSIC,it=>E.music===it[0],it=>{E.music=it[0];if(E.music==='none')Music.stop('edit');else if(E.music!=='own'||E.musicKey)Music.play(E,.6,'edit');paintTools()}),
        E.music==='own'?h('div',{class:'cats'},fileBtn(E.musicName||'Musikdatei wählen','plus','audio/*',async f=>{
          if(f.size>60*1024*1024){toast('Die Musikdatei ist größer als 60 MB.');return}
          E.musicKey='m'+uid()+Date.now().toString(36);E.musicName=f.name;
          await blobStore.put(E.musicKey,f);Music.play(E,.6,'edit');paintTools();
        })):null,
        h('p',{class:'hint'},'Chill, Beat, Retro und Ruhig hören alle. Eine eigene Datei hörst nur du auf diesem Gerät.'));
    }else if(tool==='speed'){
      body=h('div',{class:'psec'},chipRow(SPEEDS.map(s=>[s,String(s).replace('.',',')+'×']),it=>E.speed===it[0],it=>{E.speed=it[0];if(vidEl)vidEl.playbackRate=E.speed;paintTools()}));
    }else{
      body=h('div',{class:'psec'},h('label',{class:'chk',for:'osd'},h('input',{type:'checkbox',id:'osd',checked:E.vsound,onchange:e=>{E.vsound=e.target.checked;if(vidEl)vidEl.muted=!E.vsound}}),'Originalton des Videos behalten'));
    }
    toolsEl.replaceChildren(
      h('div',{class:'cats toolnav',role:'group','aria-label':'Werkzeuge'},TOOLS.map(t=>h('button',{type:'button',class:'chip','aria-pressed':String(tool===t[0]),onclick:()=>{tool=t[0];paintTools()}},t[1]))),
      body);
  }
  let ovHost=null;
  function paintOv(){
    if(!ovHost)return;
    ovHost.replaceChildren(...(E.text?[h('div',{class:'otext '+E.pos,style:'color:'+safeColor(E.color)},E.text)]:[]));
  }
  function paintEdit(){
    const fr=h('div',{class:'sframe edframe'});
    vidEl=h('video',{src:pvUrl,loop:true,playsinline:true,preload:'auto'});
    vidEl.muted=!E.vsound;
    vidEl.style.filter=FILTERS[E.filter]||'';
    const badge=h('div',{class:'pbadge',hidden:true},ic('play',34));
    ovHost=h('div',{class:'ovhost'});
    fr.append(vidEl,ovHost,badge);
    vidEl.addEventListener('loadedmetadata',()=>{
      const d=vidEl.duration;
      if(isFinite(d)&&d>0){dur=d;vidEl.playbackRate=E.speed;if(tool==='trim')paintTools()}
    });
    vidEl.addEventListener('play',()=>{badge.hidden=true;vidEl.playbackRate=E.speed});
    vidEl.addEventListener('pause',()=>{badge.hidden=false});
    vidEl.addEventListener('timeupdate',()=>{
      const t=vidEl.currentTime,te=E.te>0?E.te:0;
      if((te>0&&t>=te)||t<E.ts-.25){try{vidEl.currentTime=E.ts}catch(e){}}
    });
    fr.addEventListener('click',()=>{if(vidEl.paused)vidEl.play().catch(()=>{});else vidEl.pause()});
    vidEl.play().catch(()=>{vidEl.muted=true;vidEl.play().catch(()=>{})});
    paintOv();
    toolsEl=h('div',{class:'tools'});
    paintTools();
    box.replaceChildren(
      h('div',{class:'edbar'},
        h('button',{class:'btn',type:'button',onclick:()=>{Music.stop('edit');file=null;step='pick';paint()}},ic('back',18),'Abbrechen'),
        h('button',{class:'btn primary',type:'button',onclick:()=>{Music.stop('edit');if(vidEl)vidEl.pause();step='details';paint()}},'Speichern')),
      h('div',{class:'ed'},h('div',{class:'edwrap'},fr),toolsEl));
  }

  /* step 3 */
  async function post(){
    if(busy)return;
    if(!title.trim()){toast('Gib deinem Short einen Titel.');const t=$('#vt');if(t)t.focus();return}
    busy=true;paint();
    try{
      const st=await storeVideo(file);
      const ed={filter:E.filter,speed:E.speed,ts:E.ts,te:E.te,text:E.text.trim().slice(0,80),color:E.color,pos:E.pos,music:E.music,musicKey:E.music==='own'?E.musicKey:null,vsound:E.vsound};
      const len=Math.max(0,(E.te>0?E.te:dur)-E.ts);
      const vid=await put('videos',{title:title.trim().slice(0,80),desc:desc.trim().slice(0,300),cat:'Short',author:name,gid:gid,assetId:st.assetId,blobKey:st.blobKey,dur:len,mime:file.type,ed:ed},!!(db&&st.assetId));
      toast(st.assetId?'Dein Short ist online.':'Veröffentlicht, aber nur auf diesem Gerät sichtbar.');
      state.lastShort='v:'+vid;go('feed');
    }catch(e){busy=false;paint();toast('Das Posten hat nicht geklappt. Versuch es noch einmal.')}
  }
  function paintDetails(){
    const pv=h('video',{src:pvUrl,loop:true,playsinline:true,preload:'metadata',autoplay:true});
    pv.muted=true;
    const ed=Object.assign({},E);
    applyEd(pv,ed);
    pv.play().catch(()=>{});
    const ti=h('input',{class:'inp',id:'vt',maxlength:'80',value:title,placeholder:'Titel',oninput:e=>{title=e.target.value}});
    const de=h('textarea',{class:'inp',id:'vd',maxlength:'300',placeholder:'Beschreibung (optional)',oninput:e=>{desc=e.target.value}});
    de.value=desc;
    const share=shareable();
    const why=share?'Wird mit allen geteilt.':
      (!db?'Hier ist Novi nicht mit anderen verbunden. Das Short bleibt auf diesem Gerät.':
      !assetsCap?'Zum Teilen fehlen dir hier die Rechte. Das Short bleibt auf diesem Gerät.':
      file.size>20*1024*1024?'Über 20 MB: Das Short bleibt auf diesem Gerät. Zum Teilen bitte kürzer oder kleiner exportieren.':
      'Dieses Format wird nur auf diesem Gerät gespeichert. Zum Teilen bitte MP4 oder WebM nehmen.');
    box.replaceChildren(
      h('div',{class:'edbar'},h('b',{class:'dt'},'Gespeichert. Fast fertig.')),
      h('div',{class:'dgrid'},
        h('div',{class:'dprev'},h('div',{class:'sframe edframe'},pv,overlayText(ed))),
        h('div',{class:'form',style:'margin-top:0'},
          h('label',{class:'l',for:'vt'},'Titel',ti),
          h('label',{class:'l',for:'vd'},'Beschreibung',de),
          h('div',{class:'hint'},why+' Du postest als '+name+'.'),
          h('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
            h('button',{class:'btn primary',type:'button',disabled:busy,onclick:post},busy?'Wird veröffentlicht …':'Veröffentlichen'),
            h('button',{class:'btn',type:'button',disabled:busy,onclick:()=>{step='edit';paint()}},'Weiter bearbeiten')))));
  }
  function paint(){
    if(step==='pick')paintPick();else if(step==='edit')paintEdit();else paintDetails();
  }
  paint();
  return{el:h('div',{class:'up'},h('h1',{class:'title'},'Neues Short'),box),destroy(){Music.stop('edit');if(pvUrl)URL.revokeObjectURL(pvUrl)}};
}

/* ---------- profile ---------- */
function profileView(){
  const nm=h('input',{class:'inp',id:'nick',maxlength:'24',value:name,'aria-label':'Dein Name'});
  const body=h('div'),idRow=h('div',{class:'pid'});
  function paintId(){idRow.replaceChildren(avatar(name),h('div',{class:'f'},nm,h('button',{class:'btn primary',onclick:()=>{
    const v=nm.value.trim().slice(0,24);if(!v){toast('Der Name darf nicht leer sein.');return}
    name=v;ls('novi:name',name);toast('Name gespeichert.');paintId();paintMe();
  }},'Speichern')))}
  function paintBody(){
    const mineV=rows('videos').filter(v=>v.gid===gid).sort((a,b)=>b.createdAt-a.createdAt);
    const myLikes=rows('likes').filter(l=>l.gid===gid).length;
    const myGroups=groups().filter(g=>joined.indexOf(g.id)>=0||g.gid===gid).length;
    const st=conn==='on'?['on','Verbunden. Videos, Likes und Gruppen sind für alle sichtbar, die Novi öffnen.']:
      conn==='pending'?['','Verbindung wird aufgebaut …']:
      ['','Nicht verbunden. Alles, was du jetzt tust, bleibt auf diesem Gerät.'];
    body.replaceChildren(
      h('div',{class:'stats'},[[mineV.length,'Videos'],[myGroups,'Gruppen'],[myLikes,'Likes vergeben']].map(s=>h('div',{class:'stat'},h('b',{},s[0]),h('span',{},s[1])))),
      h('div',{class:'status'},h('span',{class:'dot '+st[0]}),h('span',{},st[1]+' Du brauchst kein Konto, dein Gast-Name gehört zu diesem Browser.')),
      h('h2',{class:'sec'},'Meine Videos'),
      mineV.length?h('div',{class:'grid pgrid'},mineV.map(v=>videoCard(v))):h('div',{class:'empty'},h('b',{},'Noch nichts gepostet'),h('span',{},'Dein erstes Video ist in einer Minute online.'),h('button',{class:'btn primary',onclick:()=>go('upload')},ic('plus',18),'Video posten')));
  }
  paintId();paintBody();
  let sig='';
  return{el:h('div',{class:'prof'},h('h1',{class:'title'},'Profil'),idRow,body),update(){
    const s=conn+rows('videos').map(v=>v.id).join()+rows('likes').length+joined.length+groups().length;
    if(s===sig)return;sig=s;paintBody();
  }};
}

/* ---------- shell: tabs, header, router ---------- */
const TABS=[['feed','bolt','Entdecken'],['upload','plus','Posten'],['groups','users','Gruppen'],['profile','user','Profil']];
const tabsEl=$('#tabs');
TABS.forEach(t=>{
  const b=h('button',{class:'tab'+(t[0]==='upload'?' post':''),'data-t':t[0],onclick:()=>go(t[0])},
    t[0]==='upload'?h('span',{class:'pl'},ic('plus',22)):ic(t[1],22),h('span',{},t[2]));
  tabsEl.append(b);
});
$('#sic').append(ic('search',18));
function paintMe(){
  const m=$('#me');
  m.replaceChildren(avatar(name));
  m.onclick=()=>go('profile');
}
$('#logo').addEventListener('click',e=>{e.preventDefault();go('feed')});
$('#q').addEventListener('input',e=>{
  state.q=e.target.value;
  if(curHash&&curHash!=='feed')go('feed');else notify();
});

function build(hash){
  if(hash.indexOf('watch-')===0)return watchView(hash.slice(6));
  if(hash.indexOf('group-')===0)return roomView(hash.slice(6));
  if(hash.indexOf('publish-')===0)return publishView(hash.slice(8));
  if(hash==='groups')return groupsView();
  if(hash==='upload')return uploadView();
  if(hash==='profile')return profileView();
  return shortsView();
}
function show(hash){
  const isDeep=x=>/^(watch|group|publish)-/.test(x||'');
  if(cur&&cur.destroy)cur.destroy();
  if(isDeep(hash)&&curHash&&!isDeep(curHash))prevTab=curHash;
  curHash=hash;
  const view=$('#view');
  view.replaceChildren();
  cur=build(hash);
  view.append(cur.el);
  document.body.classList.toggle('room',/^(group|watch|publish)-/.test(hash));
  document.body.classList.toggle('sh',!/^(watch|group|publish)-/.test(hash)&&!/^(groups|upload|profile)$/.test(hash));
  const tab=/^watch-/.test(hash)?'feed':/^(group|publish)-/.test(hash)?'groups':(hash==='groups'||hash==='upload'||hash==='profile')?hash:'feed';
  tabsEl.querySelectorAll('.tab').forEach(b=>{if(b.dataset.t===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  window.scrollTo(0,0);
}
function go(hash){
  try{if(location.hash.slice(1)!==hash)location.hash=hash}catch(e){}
  show(hash);
}
addEventListener('hashchange',()=>{const x=location.hash.slice(1)||'feed';if(x!==curHash)show(x)});

paintMe();
show(location.hash.slice(1)||'feed');
connect();
})();
</script>
